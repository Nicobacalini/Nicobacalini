name: Metrics

on:
  schedule:
    - cron: "0 4 * * *" # Se actualiza todos los días a las 04:00 UTC
  workflow_dispatch:    # Te permite ejecutarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nicobacalini
          template: classic
          base: ""
          config_twocolumns: yes
          config_timezone: America/Argentina/Buenos_Aires
          config_output: svg
          optimize: true

          # Hábitos de código (gráficos por hora y día)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: no
          plugin_habits_charts: yes

          # Calendario isométrico 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6