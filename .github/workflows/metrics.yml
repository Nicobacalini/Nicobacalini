name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nicobacalini
          template: classic
          base: ""
          config_display: large
          config_timezone: America/Argentina/Buenos_Aires
          config_output: svg
          optimize: true

          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes


          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

         # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 4
          plugin_languages_categories: programming
          plugin_languages_ignored: html, css, scss, javascript, typescript, jupyter notebook, shell, dockerfile, cmake, makefile
          plugin_languages_skipped: nombre-de-algun-repo-web-si-molesta
